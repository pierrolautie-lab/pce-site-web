name: Test du transfert (dossier de test Hostinger)

# Rejoue la séquence de transfert de deploy.yml (assets/ et img/ d'abord,
# suppressions à la fin) vers un dossier de test HORS public_html, puis le
# supprime. Ne touche jamais au dossier servi par pcevar.fr.
#
# Deux déclencheurs : `workflow_dispatch` n'est proposé par GitHub que si ce
# fichier existe sur la branche par défaut ; tant qu'il n'est que sur
# deploy-ordre-transfert, c'est le `push` ci-dessous — limité à cette
# branche ET à ce fichier — qui lance le test.
on:
  workflow_dispatch:
  push:
    branches: [deploy-ordre-transfert]
    paths: ['.github/workflows/deploy-test.yml']

jobs:
  test-transfert:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site (npm run build)
        run: npm run build

      - name: Préparer un second build simulé
        # Deuxième passage réaliste sur le même dossier : pages modifiées,
        # images nouvelles et modifiées, fichiers retirés (dont des assets),
        # pour exercer --overwrite et la passe finale de suppression.
        run: |
          cp -r dist dist2
          find dist2 -name index.html | sort | head -20 | while read -r f; do echo "<!-- test $(date +%s) -->" >> "$f"; done
          ls dist2/img/*.avif | sort | head -5 | while read -r f; do cp "$f" "${f%.avif}-test-nouveau.avif"; done
          ls dist2/img/*.webp | sort | head -3 | while read -r f; do printf 'x' >> "$f"; done
          ls dist2/img/*.jpg | sort | tail -5 | xargs rm -f
          ls dist2/assets/*.woff | sort | head -5 | xargs rm -f
          echo "build 1 : $(find dist -type f | wc -l) fichiers ; build 2 : $(find dist2 -type f | wc -l) fichiers"

      - name: Transférer vers le dossier de test, vérifier, supprimer
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          TEST_DIR: deploy-test-pce-${{ github.run_id }}
        run: |
          # Pas d'arrêt au premier échec (bash -e par défaut) : la suppression
          # du dossier de test doit s'exécuter quoi qu'il arrive avant.
          set +e
          sudo apt-get update -y && sudo apt-get install -y lftp
          FTP_SERVER=$(printf '%s' "$FTP_SERVER" | tr -d '\r\n')
          FTP_USERNAME=$(printf '%s' "$FTP_USERNAME" | tr -d '\r\n')
          FTP_PASSWORD=$(printf '%s' "$FTP_PASSWORD" | tr -d '\r\n')
          ECHEC=0

          # Connexion commune. `cmd:fail-exit` : la moindre commande en échec
          # (un `cd` raté surtout) arrête lftp, au lieu de poursuivre dans le
          # dossier courant — garde-fou contre un envoi hors du dossier de test.
          entete() {
            cat <<EOF
          set cmd:fail-exit yes
          set ssl:verify-certificate no
          set ftp:ssl-force true
          set net:timeout 20
          set net:max-retries 3
          set mirror:use-pget-n 1
          open "$FTP_SERVER:21"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          cd ..
          EOF
          }

          # Séquence identique à deploy.yml (mêmes options), source et cible
          # paramétrées, avec des marqueurs pour analyser le journal.
          transfert() {
            SRC=$1
            { entete; cat <<EOF
          mkdir -p -f $TEST_DIR
          cd $TEST_DIR
          pwd
          set xfer:make-backup no
          echo "### passe=assets prefix=assets/"
          mirror --reverse --overwrite --verbose --parallel=5 ./$SRC/assets/ assets
          echo "### passe=img prefix=img/"
          mirror --reverse --overwrite --verbose --parallel=5 ./$SRC/img/ img
          echo "### passe=reste prefix="
          mirror --reverse --overwrite --verbose --parallel=5 --exclude-glob .git* --exclude-glob .ftp-deploy-sync-state.json --exclude ^assets/ --exclude ^img/ ./$SRC/ .
          put ./$SRC/.htaccess
          echo "### passe=suppression prefix="
          mirror --reverse --delete --only-missing --overwrite --verbose --parallel=5 --exclude-glob .git* --exclude-glob .ftp-deploy-sync-state.json ./$SRC/ .
          echo "### fin"
          bye
          EOF
            } > "transfert-$SRC.lftp"
            DEBUT=$(date +%s)
            LC_ALL=C lftp -f "transfert-$SRC.lftp" > "transfert-$SRC.log" 2>&1
            CODE=$?
            echo "--- $SRC : code de sortie lftp $CODE, durée $(( $(date +%s) - DEBUT ))s"
            [ "$CODE" -ne 0 ] && ECHEC=1
            echo "envois : $(grep -c 'Transferring file' transfert-$SRC.log), suppressions : $(grep -c 'Removing old' transfert-$SRC.log)"
            echo "lignes d'erreur FTP : $(grep -ciE 'access failed|fatal error|not connected|login incorrect|max-retries|denied|cannot|error' transfert-$SRC.log)"
            grep -iE 'access failed|fatal error|not connected|login incorrect|max-retries|denied|cannot|error' "transfert-$SRC.log" | head -10
            grep -E '^/' "transfert-$SRC.log" | head -1 | sed 's/^/dossier de test : /'
            # Ordre : aucun envoi HTML avant le dernier envoi img/assets,
            # aucune suppression avant le dernier envoi.
            node -e '
              const lines = require("fs").readFileSync(process.argv[1], "utf8").split("\n"); let prefix = "", i = 0
              let firstHtml = null, lastAsset = null, firstDel = null, lastSend = null
              for (const l of lines) { let m
                if ((m = l.match(/^### passe=\S+ prefix=(.*)$/))) { prefix = m[1]; continue }
                if ((m = l.match(/Transferring file `([^\x27]+)\x27/))) { i++; const p = prefix + m[1]; lastSend = i
                  if (/^(img|assets)\//.test(p)) lastAsset = i; if (p.endsWith(".html")) firstHtml ??= i }
                if ((m = l.match(/Removing old (?:file|directory) `([^\x27]+)\x27/))) { i++; firstDel ??= i } }
              const okOrdre = firstHtml === null || lastAsset === null || lastAsset < firstHtml
              const okSupp = firstDel === null || lastSend === null || firstDel > lastSend
              console.log(`ordre img/assets avant HTML : ${okOrdre ? "OK" : "KO"} (dernier img/assets op ${lastAsset}, premier HTML op ${firstHtml})`)
              console.log(`suppressions après tous les envois : ${okSupp ? "OK" : "KO"} (dernier envoi op ${lastSend}, première suppression op ${firstDel})`)
              process.exit(okOrdre && okSupp ? 0 : 1)' "transfert-$SRC.log" || ECHEC=1
          }

          # Contenu du dossier de test comparé au build : un mirror en
          # --dry-run ne doit plus rien avoir à envoyer ni à supprimer, et le
          # nombre de fichiers distants doit égaler celui du build.
          controle() {
            SRC=$1
            { entete; cat <<EOF
          cd $TEST_DIR
          mirror --reverse --delete --dry-run --exclude-glob .git* --exclude-glob .ftp-deploy-sync-state.json ./$SRC/ .
          echo "### liste"
          find .
          bye
          EOF
            } > "controle-$SRC.lftp"
            LC_ALL=C lftp -f "controle-$SRC.lftp" > "controle-$SRC.log" 2>&1 || ECHEC=1
            RESTE=$(sed '/^### liste/,$d' "controle-$SRC.log" | grep -cE '^(get|put|rm|mkdir) ')
            DISTANT=$(sed -n '/^### liste/,$p' "controle-$SRC.log" | tail -n +2 | grep -v '/$' | wc -l)
            LOCAL=$(find "$SRC" -type f | wc -l)
            echo "--- contrôle $SRC : fichiers distants $DISTANT / build $LOCAL ; différences restantes (dry-run) : $RESTE"
            [ "$DISTANT" -eq "$LOCAL" ] && [ "$RESTE" -eq 0 ] || { ECHEC=1; sed '/^### liste/,$d' "controle-$SRC.log" | head -10; }
          }

          echo "=== Passage 1 : dossier de test vide -> build complet"
          transfert dist
          controle dist
          echo "=== Passage 2 : build complet -> build simulé modifié"
          transfert dist2
          controle dist2
          echo "=== Passage 3 : relance sur dossier à jour (doit être vide)"
          transfert dist2

          echo "=== Suppression du dossier de test"
          { entete; cat <<EOF
          rm -r $TEST_DIR
          echo "### après suppression"
          cls -1
          bye
          EOF
          } > nettoyage.lftp
          LC_ALL=C lftp -f nettoyage.lftp > nettoyage.log 2>&1 || ECHEC=1
          if sed -n '/^### après suppression/,$p' nettoyage.log | grep -q "$TEST_DIR"; then
            echo "::error::Le dossier de test $TEST_DIR est toujours présent."
            ECHEC=1
          else
            echo "Dossier de test $TEST_DIR supprimé."
          fi
          [ "$ECHEC" -eq 0 ] || { echo "::error::Test du transfert en échec (voir ci-dessus)."; exit 1; }
          echo "Test du transfert : OK"

      - name: Vérifier que la production n'a pas bougé
        # Le test ne doit rien écrire dans public_html : l'empreinte servie
        # par pcevar.fr doit rester celle de la production (main), pas celle
        # du build de cette branche — identiques ici, d'où un simple relevé.
        run: |
          curl -s --max-time 20 "https://pcevar.fr/?v=$(date +%s)" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1 | sed 's/^/empreinte servie par pcevar.fr : /'
