name: Déploiement Hostinger

# Se déclenche à chaque envoi sur main, ou manuellement depuis l'onglet
# Actions de GitHub ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site (npm run build)
        run: npm run build

      - name: Envoyer dist/ et corriger les permissions via lftp
        # L'action tierce SamKirkland/FTP-Deploy-Action a été abandonnée ici :
        # malgré un server-dir absolu correct
        # (/home/u718469912/domains/pcevar.fr/public_html/, confirmé par le
        # support Hostinger comme le vrai document root), elle a rapporté un
        # envoi réussi ("Sync complete") alors que les fichiers atterrissaient
        # ailleurs sur le serveur (/home/public_html) — constaté par le
        # support qui a dû les copier manuellement au bon endroit. lftp, lui,
        # affiche `pwd` avant chaque envoi : on voit exactement où les
        # fichiers partent, sans dépendre de la résolution de chemin interne
        # d'une action tierce.
        #
        # Nettoyage des variables (\r\n parasites) et forme d'authentification
        # ("open host:port" puis "user" séparé) : voir historique du commit,
        # plusieurs combinaisons de flags lftp ont échoué avant celle-ci.
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y lftp
          FTP_SERVER=$(printf '%s' "$FTP_SERVER" | tr -d '\r\n')
          FTP_USERNAME=$(printf '%s' "$FTP_USERNAME" | tr -d '\r\n')
          FTP_PASSWORD=$(printf '%s' "$FTP_PASSWORD" | tr -d '\r\n')
          echo "Longueurs — serveur: ${#FTP_SERVER}, utilisateur: ${#FTP_USERNAME}, mot de passe: ${#FTP_PASSWORD}"
          lftp <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-force true
          set net:timeout 20
          set net:max-retries 3
          set mirror:use-pget-n 1
          open "$FTP_SERVER:21"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          cd /home/u718469912/domains/pcevar.fr/public_html
          pwd
          mirror --reverse --delete --verbose --exclude-glob .git* --exclude-glob .ftp-deploy-sync-state.json ./dist/ .
          pwd
          ls -la
          chmod -R 755 .
          bye
          EOF
