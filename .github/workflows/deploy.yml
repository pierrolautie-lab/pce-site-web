name: Déploiement Hostinger

# Se déclenche à chaque envoi sur main, ou manuellement depuis l'onglet
# Actions de GitHub ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site (npm run build)
        run: npm run build

      - name: Envoyer dist/ vers Hostinger par FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          protocol: ftps
          # Hostinger utilise un certificat que le client FTP ne valide pas
          # toujours par défaut ; "loose" évite un blocage/timeout sur la
          # négociation TLS du canal de contrôle.
          security: loose
          local-dir: ./dist/
          # Dossier de destination sur Hostinger. Le compte FTP atterrit sur
          # /home/u718469912/ (racine du compte d'hébergement, pas du
          # domaine) : le dossier réellement servi par Apache pour
          # pcevar.fr est domains/pcevar.fr/public_html/.
          server-dir: ./domains/pcevar.fr/public_html/
          exclude: |
            **/.git*
            **/.git*/**

      - name: Corriger les permissions sur Hostinger
        # lftp n'a pas de commande "find -type" comme le find Unix : on ne
        # peut pas distinguer fichiers/dossiers de façon fiable en un seul
        # script FTP. On applique donc 755 à tout l'arborescence (dossiers
        # ET fichiers) : les fichiers restent lisibles par tous (le bit
        # d'exécution est simplement ignoré par Apache pour du HTML/CSS/JS
        # statique), ce qui résout un 403 dû à des permissions trop
        # restrictives sans risque de casser l'affichage du site.
        #
        # Identifiants passés en argument (-u), pas interpolés dans un
        # texte de script : deux tentatives précédentes qui recollaient le
        # mot de passe dans une chaîne "-e ..." ont cassé le parsing lftp
        # dès qu'un caractère spécial du mot de passe s'y trouvait
        # ("Unknown command", "Not connected"). En argument direct, bash
        # transmet la valeur telle quelle sans repasser par un parseur de
        # script. Les commandes elles-mêmes arrivent par un heredoc à
        # délimiteur quoté ('EOF'), donc jamais réinterprétées par bash.
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER" <<'EOF'
          set ssl:verify-certificate no
          set ftp:ssl-force true
          set net:timeout 15
          set net:max-retries 2
          cd domains/pcevar.fr/public_html
          chmod -R 755 .
          bye
          EOF
