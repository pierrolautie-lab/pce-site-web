name: Déploiement Hostinger

# Se déclenche à chaque envoi sur main, ou manuellement depuis l'onglet
# Actions de GitHub ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site (npm run build)
        run: npm run build

      - name: Envoyer dist/ et corriger les permissions via lftp
        # L'action tierce SamKirkland/FTP-Deploy-Action a été abandonnée ici :
        # malgré un server-dir absolu qui semblait correct, elle a rapporté un
        # envoi réussi ("Sync complete") alors que les fichiers atterrissaient
        # ailleurs sur le serveur. lftp, lui, affiche `pwd` avant chaque
        # envoi : on voit exactement où les fichiers partent, sans dépendre
        # de la résolution de chemin interne d'une action tierce.
        #
        # ⚠️ 2026-08-11 — Chemin cible changé pour domains/pcevar.fr/public_html/,
        # confirmé par le support Hostinger le jour même comme la racine réelle
        # du domaine (/home/u718469912/domains/pcevar.fr/public_html). Un
        # diagnostic FTP en lecture seule avait déjà montré la même chose
        # (empreinte des assets servis identique au contenu de ce dossier,
        # figé au 8 août). Le fichier domains/pcevar.fr/DO_NOT_UPLOAD_HERE
        # (daté du 4 août) ne change rien à la configuration du domaine selon
        # le support — laissé en place, sans certitude sur son origine.
        # public_html/ à la racine du compte n'est pas utilisé pour pcevar.fr
        # (confirmé par le support) ; laissé en l'état, pas supprimé, au cas
        # où une autre configuration du compte en dépendrait.
        #
        # Chemin précédent : public_html/ à la racine du compte FTP — utilisé
        # à tort du 4 au 11 août 2026 sur la base d'une vérification Hostinger
        # antérieure qui s'est révélée incorrecte (ou périmée).
        #
        # Nettoyage des variables (\r\n parasites) et forme d'authentification
        # ("open host:port" puis "user" séparé) : voir historique du commit,
        # plusieurs combinaisons de flags lftp ont échoué avant celle-ci.
        #
        # `mirror` compare déjà taille/date et ne renvoie que ce qui a changé
        # (incrémental par défaut) — `--delete` retire du serveur ce qui n'a
        # plus d'équivalent local, `--parallel=5` accélère l'envoi des 268
        # dossiers en les transférant en parallèle plutôt qu'un par un. Le
        # `put ./dist/.htaccess` après `mirror` est une sécurité explicite :
        # sans lui, un serveur FTP qui masque les fichiers point dans son
        # listing pourrait fausser la comparaison de `mirror` sur ce fichier
        # précis, dont dépend tout le routage des 268 pages.
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y lftp
          FTP_SERVER=$(printf '%s' "$FTP_SERVER" | tr -d '\r\n')
          FTP_USERNAME=$(printf '%s' "$FTP_USERNAME" | tr -d '\r\n')
          FTP_PASSWORD=$(printf '%s' "$FTP_PASSWORD" | tr -d '\r\n')
          echo "Longueurs — serveur: ${#FTP_SERVER}, utilisateur: ${#FTP_USERNAME}, mot de passe: ${#FTP_PASSWORD}"

          # ⚠️ 2026-08-11 : deux échecs le même jour, "max-retries exceeded"
          # dès la commande cd (donc avant tout transfert) — la connexion FTP
          # elle-même est refusée par intermittence, pas un souci de fichier.
          # `net:max-retries 3` dans lftp ne couvre que les tentatives DANS
          # une même session ; si la session entière échoue à s'établir, rien
          # ne la relançait — il fallait relancer le run manuellement. Cette
          # boucle retente la connexion complète jusqu'à 3 fois, avec une
          # pause, avant d'abandonner pour de bon.
          MAX_ATTEMPTS=3
          attempt=1
          until [ "$attempt" -gt "$MAX_ATTEMPTS" ]; do
            echo "=== Tentative de transfert $attempt/$MAX_ATTEMPTS ==="
            DEBUT=$(date +%s)
            if lftp <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-force true
          set net:timeout 20
          set net:max-retries 3
          set mirror:use-pget-n 1
          open "$FTP_SERVER:21"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          cd ../domains/pcevar.fr/public_html
          pwd
          mirror --reverse --delete --verbose --parallel=5 --exclude-glob .git* --exclude-glob .ftp-deploy-sync-state.json ./dist/ .
          put ./dist/.htaccess
          pwd
          ls -la
          echo "--- img/ ---"
          ls -la img/
          echo "--- vérification .htaccess ---"
          ls -la .htaccess
          chmod -R 755 .
          bye
          EOF
            then
              FIN=$(date +%s)
              echo "Durée de l'envoi FTP : $((FIN - DEBUT))s (tentative $attempt)"
              break
            fi
            echo "Tentative $attempt échouée."
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Les $MAX_ATTEMPTS tentatives de transfert FTP ont échoué."
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 30
          done

      - name: Vérifier que le site en ligne correspond bien au build envoyé
        # Garde-fou direct suite à l'incident du 2026-08-11 : un transfert
        # FTP réussi ne prouve pas que le bon dossier est servi (voir le
        # commentaire de l'étape précédente). On compare ici l'empreinte
        # d'asset du dist/ qu'on vient d'envoyer à celle réellement rendue
        # par https://pcevar.fr — le job échoue net, avec les deux valeurs
        # affichées, si elles diffèrent. Un petit délai avant la requête
        # laisse le temps au serveur de servir les fichiers qu'on vient
        # d'écrire.
        #
        # ⚠️ 2026-08-11 (faux négatif) : le motif d'empreinte n'acceptait que
        # [A-Za-z0-9], alors que les hachages générés par Rollup peuvent
        # contenir "_" et "-" (ex. index-C_o26_XP.js). Résultat : la commande
        # ne trouvait aucune empreinte locale et le job échouait alors que le
        # transfert et le site en ligne étaient corrects. Élargi à
        # [A-Za-z0-9_-].
        #
        # ⚠️ Cette étape ne vérifie que l'accueil : un déploiement peut y
        # réussir alors que d'autres pages manquent (incident du 2026-08-11 :
        # un run FTP interrompu en cours de transfert avait mis à jour
        # l'accueil et le sitemap sans avoir eu le temps d'envoyer 15 pages
        # locales). Voir l'étape suivante pour un contrôle sur un échantillon
        # de pages, pas seulement l'accueil.
        run: |
          sleep 5
          LOCAL_HASH=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          if [ -z "$LOCAL_HASH" ]; then
            echo "::error::Empreinte introuvable dans dist/index.html — le build local est-il correct ?"
            exit 1
          fi
          LIVE_HTML=$(curl -s --max-time 20 -H "Cache-Control: no-cache" "https://pcevar.fr/?v=$(date +%s)")
          LIVE_HASH=$(echo "$LIVE_HTML" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          echo "Empreinte du build envoyé : $LOCAL_HASH"
          echo "Empreinte servie par pcevar.fr : ${LIVE_HASH:-(aucune trouvée)}"
          if [ "$LOCAL_HASH" != "$LIVE_HASH" ]; then
            echo "::error::Le site en ligne ne correspond pas au build envoyé. Le transfert a réussi mais pcevar.fr sert autre chose (mauvais dossier, cache, ou site tiers)."
            exit 1
          fi
          echo "OK — pcevar.fr sert bien le build qui vient d'être envoyé."

      - name: Vérifier un échantillon de pages (pas seulement l'accueil)
        # Ajouté suite à l'incident du 2026-08-11 : l'étape précédente ne
        # vérifie que l'accueil, donc un transfert partiel qui la touche en
        # premier passe le garde-fou alors que d'autres pages manquent
        # encore. Tire 10 pages au hasard dans chacune des 3 familles
        # (statiques, locales, articles) et vérifie que chacune sert bien
        # SON PROPRE contenu (comparaison du <link rel="canonical">, pas
        # juste la taille — une page absente retombe sur l'accueil
        # prérendue, assez grande pour tromper un contrôle de taille seul).
        # Échantillon, pas exhaustif : les 283 pages complètes restent
        # disponibles via `npm run verify:live` en dehors de la CI.
        run: node scripts/verify-live.js https://pcevar.fr --sample=10
