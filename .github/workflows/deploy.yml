name: Déploiement Hostinger

# Se déclenche à chaque envoi sur main, ou manuellement depuis l'onglet
# Actions de GitHub ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site (npm run build)
        run: npm run build

      - name: Envoyer dist/ via rsync sur SSH
        # ⚠️ 2026-08-11 — BRANCHE DE PRÉPARATION, PAS ENCORE FUSIONNÉE.
        # Remplace l'étape FTP/lftp (voir git log de ce fichier pour son
        # historique complet) : un transfert FTP classique de ~900 fichiers
        # répartis sur 283 dossiers prenait 15+ minutes, avec un protocole qui
        # négocie une connexion par fichier. rsync sur SSH transfère en un
        # seul flux compressé et ne renvoie que les fichiers qui ont changé
        # (comme `mirror`, mais sans le coût par-fichier du FTP) : de l'ordre
        # de quelques secondes à 1 minute pour un déploiement incrémental une
        # fois la première synchronisation complète faite.
        #
        # Chemin cible : /home/u718469912/domains/pcevar.fr/public_html/ — la
        # racine réelle du domaine, confirmée par le support Hostinger le
        # 2026-08-11 (voir README, section « Deux emplacements sur le
        # serveur »). Chemin absolu, donc indépendant du dossier où la
        # connexion SSH atterrit par défaut — contrairement au FTP, pas de
        # mauvaise surprise possible sur ce point.
        #
        # Secrets nécessaires (à créer avant de fusionner cette branche) :
        #   HOSTINGER_SSH_HOST      hôte SSH (hPanel -> Avancé -> Accès SSH)
        #   HOSTINGER_SSH_PORT      port SSH (souvent 65002 chez Hostinger,
        #                           jamais 22 sur de l'hébergement mutualisé)
        #   HOSTINGER_SSH_USER      identifiant SSH (le même que le FTP,
        #                           généralement)
        #   HOSTINGER_SSH_KEY       clé privée (PEM), la clé publique
        #                           correspondante doit être ajoutée dans
        #                           hPanel -> Avancé -> Accès SSH -> Gérer
        #                           les clés SSH
        # Une paire de clés dédiée au déploiement (pas une clé personnelle) a
        # été générée pour cette préparation — voir le message qui accompagne
        # ce commit pour la clé publique à ajouter dans hPanel.
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          DEBUT=$(date +%s)
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            --exclude='.git*' \
            dist/ "$SSH_USER@$SSH_HOST:/home/u718469912/domains/pcevar.fr/public_html/"
          FIN=$(date +%s)
          echo "Durée de l'envoi rsync : $((FIN - DEBUT))s"
          rm -f ~/.ssh/deploy_key

      - name: Vérifier que le site en ligne correspond bien au build envoyé
        # Garde-fou direct suite à l'incident du 2026-08-11 : un transfert
        # FTP réussi ne prouve pas que le bon dossier est servi (voir le
        # commentaire de l'étape précédente). On compare ici l'empreinte
        # d'asset du dist/ qu'on vient d'envoyer à celle réellement rendue
        # par https://pcevar.fr — le job échoue net, avec les deux valeurs
        # affichées, si elles diffèrent. Un petit délai avant la requête
        # laisse le temps au serveur de servir les fichiers qu'on vient
        # d'écrire.
        run: |
          sleep 5
          LOCAL_HASH=$(grep -oE 'assets/index-[A-Za-z0-9]+\.js' dist/index.html | head -1)
          if [ -z "$LOCAL_HASH" ]; then
            echo "::error::Empreinte introuvable dans dist/index.html — le build local est-il correct ?"
            exit 1
          fi
          LIVE_HTML=$(curl -s --max-time 20 -H "Cache-Control: no-cache" "https://pcevar.fr/?v=$(date +%s)")
          LIVE_HASH=$(echo "$LIVE_HTML" | grep -oE 'assets/index-[A-Za-z0-9]+\.js' | head -1)
          echo "Empreinte du build envoyé : $LOCAL_HASH"
          echo "Empreinte servie par pcevar.fr : ${LIVE_HASH:-(aucune trouvée)}"
          if [ "$LOCAL_HASH" != "$LIVE_HASH" ]; then
            echo "::error::Le site en ligne ne correspond pas au build envoyé. Le transfert a réussi mais pcevar.fr sert autre chose (mauvais dossier, cache, ou site tiers)."
            exit 1
          fi
          echo "OK — pcevar.fr sert bien le build qui vient d'être envoyé."
