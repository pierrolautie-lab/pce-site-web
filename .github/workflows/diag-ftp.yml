name: Diagnostic FTP (lecture seule)

# Déclenché manuellement uniquement — jamais sur push, pour ne jamais se
# confondre avec le déploiement. But : lire le .htaccess réellement en ligne
# et la taille d'un fichier prérendu précis, sans rien transférer ni modifier.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Lire .htaccess et chercher un second emplacement servi via lftp
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y lftp
          FTP_SERVER=$(printf '%s' "$FTP_SERVER" | tr -d '\r\n')
          FTP_USERNAME=$(printf '%s' "$FTP_USERNAME" | tr -d '\r\n')
          FTP_PASSWORD=$(printf '%s' "$FTP_PASSWORD" | tr -d '\r\n')
          lftp <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-force true
          set net:timeout 20
          set net:max-retries 3
          open "$FTP_SERVER:21"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          echo "=== pwd (répertoire de connexion) ==="
          pwd
          echo "=== ls -la . (répertoire courant, pour voir si public_html est un lien symbolique) ==="
          ls -la .
          echo "=== ls -la .. (un niveau au-dessus du répertoire de dépôt actuel) ==="
          cd ..
          pwd
          ls -la .
          echo "=== domains/ existe-t-il à ce niveau ? ==="
          ls -la domains/ 2>&1
          echo "=== domains/pcevar.fr/ ==="
          ls -la domains/pcevar.fr/ 2>&1
          echo "=== domains/pcevar.fr/public_html/ ==="
          ls -la domains/pcevar.fr/public_html/ 2>&1
          echo "=== domains/pcevar.fr/public_html/index.html ==="
          ls -la domains/pcevar.fr/public_html/index.html 2>&1
          echo "=== domains/pcevar.fr/public_html/assets/ ==="
          ls -la domains/pcevar.fr/public_html/assets/ 2>&1
          echo "=== autres racines webroot courantes, au cas où ==="
          ls -la htdocs/ 2>&1
          ls -la www/ 2>&1
          echo "=== rappel : le dossier où le mirror écrit actuellement ==="
          cd public_html
          pwd
          ls -la index.html
          ls -la assets/ | head -5
          bye
          EOF
