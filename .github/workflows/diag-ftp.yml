name: Diagnostic FTP (lecture seule)

# Déclenché manuellement uniquement — jamais sur push, pour ne jamais se
# confondre avec le déploiement.
#
# 2026-08-11 : repurposé en diagnostic de connectivité après deux échecs FTP
# consécutifs ("max-retries exceeded" dès la commande cd) espacés de 2h30.
# Le support Hostinger a demandé l'IP publique du runner pour vérifier un
# éventuel blocage pare-feu. Affiche l'IP puis tente une connexion FTP
# minimale (ouverture + authentification + pwd, rien d'autre) pour savoir si
# le blocage est encore actif au moment du test.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: IP publique du runner
        run: |
          echo "IP publique de ce runner GitHub Actions :"
          curl -4 -s --max-time 10 https://api.ipify.org
          echo

      - name: Test de connexion FTP minimal
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y lftp
          FTP_SERVER=$(printf '%s' "$FTP_SERVER" | tr -d '\r\n')
          FTP_USERNAME=$(printf '%s' "$FTP_USERNAME" | tr -d '\r\n')
          FTP_PASSWORD=$(printf '%s' "$FTP_PASSWORD" | tr -d '\r\n')
          DEBUT=$(date +%s)
          lftp <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-force true
          set net:timeout 20
          set net:max-retries 3
          open "$FTP_SERVER:21"
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          pwd
          bye
          EOF
          FIN=$(date +%s)
          echo "Durée du test : $((FIN - DEBUT))s"
